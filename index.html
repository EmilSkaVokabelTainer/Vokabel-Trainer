<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vokabel Trainer</title>
<style>
:root{
 --bg:#f6f7f9;--surface:#fff;--surface2:#f9fafb;--text:#17202a;--muted:#6b7682;--line:#e4e8ed;
 --accent:#2f6fed;--accent2:#eef4ff;--green:#2f8a62;--green2:#edf8f2;--red:#cf5f68;--red2:#fff0f1;
 --shadow:0 14px 35px rgba(20,30,45,.08);--shadow-sm:0 4px 16px rgba(20,30,45,.06);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}
.app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:244px;background:rgba(255,255,255,.96);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;z-index:40}
.logo{display:flex;align-items:center;gap:10px;padding:8px 10px 24px;font-weight:800;font-size:18px}.logo-mark{width:34px;height:34px;border-radius:10px;background:var(--accent2);display:grid;place-items:center;font-size:18px}
.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;text-align:left;color:#5c6773;padding:11px 12px;border-radius:10px;font-size:13px;display:flex;align-items:center;gap:10px}.nav button:hover{background:#f5f7f9}.nav button.active{background:var(--accent2);color:var(--accent);font-weight:700}
.nav .ico{width:20px;text-align:center;font-size:15px}.sidegoal{margin-top:auto;padding:14px 10px 4px;border-top:1px solid var(--line)}.goalrow{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px;margin-bottom:8px}.goalrow b{color:var(--text)}.bar{height:7px;background:#edf0f3;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:inherit;transition:none}
.main{margin-left:244px;min-height:100vh}.topbar{height:76px;background:rgba(246,247,249,.92);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:20;backdrop-filter:blur(10px)}.top-title h1{font-size:24px;margin:0 0 3px}.top-title p{margin:0;color:var(--muted);font-size:12px}.top-actions{display:flex;gap:8px;align-items:center}
.content{max-width:1240px;padding:28px 34px 46px}.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-sm);padding:20px}.hero{padding:28px;display:flex;justify-content:space-between;gap:24px;align-items:flex-end}.hero h2{margin:0 0 8px;font-size:28px}.hero p{margin:0;color:var(--muted);line-height:1.6;font-size:13px;max-width:720px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:10px;padding:10px 13px;font-size:12px;font-weight:650}.btn:hover{background:#f7f8fa}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover{filter:brightness(.96)}.btn.green{background:var(--green);border-color:var(--green);color:#fff}.btn.danger{color:var(--red);border-color:#f0cfd2;background:#fff}.btn.soft{background:var(--accent2);border-color:#dce7ff;color:var(--accent)}
.metric .label{font-size:11px;color:var(--muted)}.metric .value{font-size:31px;font-weight:800;margin-top:7px}.metric .sub{font-size:11px;color:var(--muted);margin-top:4px}.section-title{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:26px 0 12px}.section-title h3{font-size:16px;margin:0}.section-title span{font-size:11px;color:var(--muted)}
.practice{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.practice-card{padding:20px;border:1px solid var(--line);border-radius:14px;background:#fff}.practice-top{display:flex;gap:12px;align-items:flex-start}.practice-icon{width:42px;height:42px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;font-size:20px;border:1px solid var(--line)}.practice-card h3{margin:1px 0 5px;font-size:15px}.practice-card p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}.practice-card .foot{display:flex;align-items:center;justify-content:space-between;margin-top:16px}.pill{border:1px solid var(--line);padding:5px 8px;border-radius:999px;font-size:10px;color:var(--muted);background:#fafbfc}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.level{border:1px solid var(--line);border-radius:14px;padding:18px;background:#fff}.level.current{border-color:#ccdafe;background:#fbfcff}.level .count{font-size:27px;font-weight:800;margin:9px 0 3px}.level p{font-size:11px;color:var(--muted);line-height:1.45;margin:0}.level .status{font-size:10px;color:var(--accent);margin-top:10px;min-height:16px}
.input{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 12px;outline:0;font-size:12px}.input:focus,.textarea:focus{border-color:#9ab7f7;box-shadow:0 0 0 3px #edf3ff}.textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:10px;padding:11px 12px;resize:vertical;outline:0}.toolrow{display:grid;grid-template-columns:1fr auto auto auto;gap:8px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;margin-top:14px}table{width:100%;min-width:760px;border-collapse:collapse}th,td{padding:11px 12px;border-bottom:1px solid #eef1f3;text-align:left;font-size:12px}th{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:#fafbfc}.tag{font-size:10px;padding:4px 8px;border-radius:999px;background:#f2f4f7;border:1px solid #e5e8ec;color:#616c77}.empty{text-align:center;padding:54px 18px;color:var(--muted)}.notice{padding:11px 12px;border:1px solid #ebe0be;background:#fffbef;border-radius:11px;color:#7b6a38;font-size:11px}
.stats-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}.chart{height:230px;display:flex;align-items:flex-end;gap:10px;padding:20px 10px 10px}.barcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}.barcol i{width:100%;max-width:38px;border-radius:8px 8px 3px 3px;background:#d9e2f7;min-height:4px}.barcol span{font-size:10px;color:var(--muted)}
/* exercise */
#exercise{position:fixed;inset:0;background:#f5f6f8;z-index:100;display:none}#exercise.show{display:block}.exercise-head{height:68px;display:flex;justify-content:space-between;align-items:center;background:#fff;border-bottom:1px solid var(--line);padding:0 22px}.exercise-left,.exercise-right{display:flex;align-items:center;gap:12px}.exercise-title{font-weight:800;font-size:14px}.exercise-sub{font-size:10px;color:var(--muted);margin-top:2px}.exercise-body{height:calc(100vh - 68px);padding:20px;display:flex;flex-direction:column;min-height:0}.exercise-shell{flex:1;min-height:0;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;padding:18px}.progressline{height:6px;background:#eef0f3;border-radius:999px;overflow:hidden}.progressline i{height:100%;display:block;background:var(--accent);width:0}.exercise-stage{flex:1;min-height:0;display:grid;place-items:center;padding:18px}.flash-wrap{width:min(850px,95vw)}.flash-card{min-height:430px;border:1px solid #dfe4e9;border-radius:18px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;box-shadow:0 9px 25px rgba(20,30,45,.05)}.flash-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:800;margin-bottom:18px}.flash-word{font-size:clamp(38px,6vw,64px);line-height:1.1;font-weight:850;max-width:92%}.flash-note{font-size:11px;color:var(--muted);margin-top:16px}.exercise-foot{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;padding-top:16px}.answer-grid{width:min(880px,95vw);display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.answer{border:1px solid var(--line);background:#fff;border-radius:13px;padding:16px;text-align:left;min-height:68px}.answer:hover:not(:disabled){background:#f7f9fc;border-color:#c9d7ec}.answer.ok{background:var(--green2);border-color:#9fd0b4}.answer.no{background:var(--red2);border-color:#e2a6ad}.write-box{width:min(700px,95vw);text-align:center}.big-word{font-size:clamp(35px,5vw,56px);font-weight:850;margin:15px 0 24px}.accent{display:flex;justify-content:center;flex-wrap:wrap;gap:5px;margin-top:8px}.accent button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 9px;font-size:11px}.hint{font-size:11px;color:var(--muted);margin-top:10px}.timer{font-size:26px;font-weight:850}.endbox{width:min(720px,95vw);text-align:center}.endbox h2{font-size:32px;margin:0 0 7px}.endstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.modal{position:fixed;inset:0;background:rgba(20,25,32,.24);z-index:200;display:none;place-items:center;padding:16px}.modal.show{display:grid}.modal-box{width:min(620px,100%);background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px;max-height:90vh;overflow:auto}.formrow{margin-bottom:12px}.formrow label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800;margin-bottom:6px}
@media(max-width:1000px){.sidebar{width:210px}.main{margin-left:210px}.g4{grid-template-columns:repeat(2,1fr)}.stats-grid{grid-template-columns:1fr}.practice{grid-template-columns:1fr}.levels{grid-template-columns:1fr}}
@media(max-width:740px){.sidebar{position:static;width:auto;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px}.logo{padding:8px 10px 12px}.nav{grid-template-columns:repeat(5,1fr)}.nav button{justify-content:center;text-align:center;font-size:10px;padding:9px 5px}.nav button span:last-child{display:none}.sidegoal{display:none}.main{margin-left:0}.topbar{height:64px;padding:0 14px}.top-title h1{font-size:20px}.content{padding:18px 12px 30px}.g4,.g3,.g2{grid-template-columns:1fr}.hero{padding:22px;display:block}.hero .actions{margin-top:14px}.toolrow{grid-template-columns:1fr 1fr}.toolrow .wide{grid-column:1/-1}.answer-grid{grid-template-columns:1fr}.endstats{grid-template-columns:1fr}.exercise-head{padding:0 12px}.exercise-body{padding:10px}.flash-card{min-height:360px}.exercise-shell{padding:12px}.exercise-right .hide-sm{display:none}}
</style>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f6fed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vokabel Trainer">
<link rel="apple-touch-icon" href="icon-180.png">
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="logo"><div class="logo-mark">📚</div><div>Vokabel Trainer</div></div>
  <nav class="nav">
    <button data-page="home" class="active"><span class="ico">⌂</span><span>Startseite</span></button>
    <button data-page="learn"><span class="ico">▶</span><span>Lernen</span></button>
    <button data-page="words"><span class="ico">☷</span><span>Vokabeln</span></button>
    <button data-page="stats"><span class="ico">▥</span><span>Statistik</span></button>
    <button data-page="settings"><span class="ico">⚙</span><span>Einstellungen</span></button>
  </nav>
  <div class="sidegoal">
    <div class="goalrow"><span>Tagesziel</span><b id="goaltext">0 / 20</b></div>
    <div class="bar"><i id="goalbar"></i></div>
  </div>
</aside>
<main class="main">
  <header class="topbar">
    <div class="top-title"><h1 id="pageTitle">Vokabel Trainer</h1><p id="pageSubtitle">Deutsch ↔ Französisch</p></div>
    <div class="top-actions"><button class="btn primary" id="addTop">+ Vokabel</button></div>
  </header>
  <section class="content" id="content"></section>
</main>
</div>
<div id="exercise"></div>
<div class="modal" id="modal"><div class="modal-box"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:16px"><strong id="modalTitle">Vokabel</strong><button class="btn" id="modalClose">Schließen</button></div><div id="modalContent"></div></div></div>
<script>
"use strict";
const SEED=[
["laisser qn tranquille","jdn in Ruhe lassen"],["sérieux/sérieuse","ernst, ernsthaft"],["débrouillard/débrouillarde","geschickt, pfiffig"],["populaire","beliebt"],["malade","krank"],["le voisin / la voisine","der/die (Sitz-)Nachbar/in"],["le sac","die Tasche, auch: die Schultasche"],["le bulletin","das Zeugnis"],["le conseil","der Rat, der Ratschlag"],["le résultat","das Ergebnis, das Resultat"],["le test","der Test"],["le genre (de qc)","die Art"],["le réveil","der Wecker"],["sonner","klingeln"],["plus","mehr"],["sans + inf.","ohne etwas zu tun"],["stresser qn","jdn stressen"],["dire qc (à qn)","(jdm) etwas sagen"],["que","dass"],["devoir + inf.","etwas tun müssen"],["au moins","mindestens, wenigstens"],["à cause de","wegen"],["une impression","ein Eindruck"],["à la place de (qn/qc)","anstelle von (jdm/etw.), statt"],["seul/seule","allein"],["poser une question (à qn)","(jdm) eine Frage stellen"],["une excuse","eine Entschuldigung, auch: eine Ausrede"],["la pression","der Druck"],["mettre la pression à qn","jdn unter Druck setzen"],["le temps","die Zeit"],["dernier/dernière","letzter/letzte/letztes"],["réviser","(etw.) lernen, etw. wiederholen"],["participer en cours","im Unterricht mitarbeiten"],["rendre qc (à qn)","(jdm) etw. zurückgeben"],["mauvais/mauvaise","schlecht"],["la note","die Note"],["la moyenne","der Durchschnitt"]
].map((x,i)=>({id:"u4-"+(i+1),fr:x[0],de:x[1],tag:"Unité 4",correct:0,wrong:0,box:1,lastLearned:null}));
const STORAGE="vokabeltrainer_beautiful_v1";
let state=loadState(),page="home",session=null,flipped=false,speedTimer=null,speechAvailable="speechSynthesis" in window;
function today(){return new Date().toISOString().slice(0,10)}
function clone(x){return JSON.parse(JSON.stringify(x))}
function loadState(){try{let r=JSON.parse(localStorage.getItem(STORAGE));if(r&&Array.isArray(r.vocab))return r}catch(e){}let s={vocab:clone(SEED),goal:20,today:0,lastDay:today(),streak:0,bestStreak:0,highscore:0,daily:{},progress:{}};localStorage.setItem(STORAGE,JSON.stringify(s));return s}
function save(){localStorage.setItem(STORAGE,JSON.stringify(state))}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function norm(s){return String(s||"").toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/œ/g,"oe").replace(/æ/g,"ae").replace(/\s+/g," ")}
function shuffle(a){let x=[...a];for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function distance(a,b){let d=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));for(let i=0;i<=a.length;i++)d[i][0]=i;for(let j=0;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function closeEnough(a,b){let x=norm(a),y=norm(b);return x===y||distance(x,y)<=(Math.max(x.length,y.length)>=8?2:1)}
function toast(t){let e=document.createElement("div");e.textContent=t;e.style.cssText="position:fixed;right:16px;bottom:16px;z-index:600;background:#fff;border:1px solid #e4e8ed;border-radius:10px;padding:11px 13px;box-shadow:0 8px 22px rgba(20,30,45,.12);font-size:12px";document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}
function updateGoal(){if(state.lastDay!==today()){state.lastDay=today();state.today=0;save()}let g=state.goal||20,n=state.today||0;document.getElementById("goaltext").textContent=n+" / "+g;document.getElementById("goalbar").style.width=Math.min(100,Math.round(n/g*100))+"%"}
function navigate(p){if(document.getElementById("exercise").classList.contains("show"))return;page=p;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));renderPage()}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>navigate(b.dataset.page));document.getElementById("addTop").onclick=()=>openWordModal();document.getElementById("modalClose").onclick=closeModal;document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")closeModal()};
function renderPage(){updateGoal();let c=document.getElementById("content");if(page==="home")renderHome(c);else if(page==="learn")renderLearn(c);else if(page==="words")renderWords(c);else if(page==="stats")renderStats(c);else renderSettings(c)}
function renderHome(c){document.getElementById("pageTitle").textContent="Vokabel Trainer";document.getElementById("pageSubtitle").textContent="Deutsch ↔ Französisch";let r=state.vocab.reduce((a,v)=>a+(v.correct||0),0),w=state.vocab.reduce((a,v)=>a+(v.wrong||0),0),rate=r+w?Math.round(r/(r+w)*100):0;let weak=[...state.vocab].sort((a,b)=>(a.box||1)-(b.box||1)).slice(0,4);
c.innerHTML=`<div class="card hero"><div><div class="eyebrow">Dein Lernbereich</div><h2>Bereit für eine Runde?</h2><p>${state.vocab.length} Vokabeln sind gespeichert. Starte eine Übung und lerne in deinem eigenen Tempo.</p><div class="actions"><button class="btn primary" id="goLearn">Lernen starten</button><button class="btn" id="goWords">Vokabeln ansehen</button></div></div><div style="min-width:190px;text-align:right"><div class="eyebrow">Heute</div><div style="font-size:42px;font-weight:850;margin-top:6px">${state.today||0}</div><div class="muted" style="font-size:11px">von ${state.goal||20} gelernt</div></div></div>
<div class="grid g4" style="margin-top:16px"><div class="card metric"><div class="label">Vokabeln</div><div class="value">${state.vocab.length}</div><div class="sub">gespeichert</div></div><div class="card metric"><div class="label">Erfolgsquote</div><div class="value">${rate}%</div><div class="sub">${r+w} Antworten</div></div><div class="card metric"><div class="label">Streak</div><div class="value">🔥 ${state.streak||0}</div><div class="sub">Bester: ${state.bestStreak||0}</div></div><div class="card metric"><div class="label">Speed-Rekord</div><div class="value">${state.highscore||0}</div><div class="sub">richtige Antworten</div></div></div>
<div class="section-title"><h3>Zuletzt / als Nächstes</h3><span>schwierige Vokabeln zuerst</span></div><div class="grid g2">${weak.map(v=>`<div class="card" style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><div style="font-size:15px;font-weight:750">${esc(v.de)}</div><div class="muted" style="font-size:11px;margin-top:4px">${esc(v.fr)}</div></div><span class="tag">Box ${v.box||1}/5</span></div>`).join("")}</div>`;
document.getElementById("goLearn").onclick=()=>navigate("learn");document.getElementById("goWords").onclick=()=>navigate("words")}
function renderLearn(c){document.getElementById("pageTitle").textContent="Lernen";document.getElementById("pageSubtitle").textContent="Übung auswählen";let n=state.vocab.length;c.innerHTML=`<div class="card"><div class="eyebrow">Übungen</div><h2 style="margin:5px 0;font-size:25px">Wie möchtest du lernen?</h2><p class="muted" style="font-size:12px;margin:0">Jede Runde ist zufällig zusammengestellt. Während einer Übung kannst du nicht in andere Übungen wechseln.</p>${n<4?`<div class="notice" style="margin-top:15px">Für das Quiz werden mindestens 4 verschiedene Vokabeln benötigt.</div>`:""}<div class="practice" style="margin-top:18px">${practiceCard("flash","🃏","Karteikarten","Deutsch ansehen, umdrehen und danach bewerten.")}${practiceCard("quiz","🎯","Quiz","Vier Antworten, eine davon ist richtig.",n<4)}${practiceCard("write","✍️","Schreiben","Die französische Übersetzung selbst eintippen.")}${practiceCard("speed","⚡","Speed","60 Sekunden und möglichst viele richtige Antworten.")}${practiceCard("spaced","🧠","Lern-Modus","Schwierigere Vokabeln werden häufiger gewählt.")}</div></div>`;c.querySelectorAll("[data-ex]").forEach(b=>b.onclick=()=>showLevels(b.dataset.ex))}
function practiceCard(m,icon,title,text,disabled=false){return `<div class="practice-card"><div class="practice-top"><div class="practice-icon">${icon}</div><div><h3>${title}</h3><p>${text}</p></div></div><div class="foot"><span class="pill">3 Stufen</span><button class="btn ${disabled?"":"primary"}" data-ex="${m}" ${disabled?"disabled":""}>${disabled?"Ab 4 Vokabeln":"Öffnen"}</button></div></div>`}
function levelCount(l){return l===1?Math.min(5,state.vocab.length):l===2?Math.min(10,state.vocab.length):state.vocab.length}
function pkey(m,l){return m+"_"+l}
function showLevels(m){let title={flash:"Karteikarten",quiz:"Quiz",write:"Schreiben",speed:"Speed",spaced:"Lern-Modus"}[m];let levels=[1,2,3].map(l=>{let p=state.progress?.[pkey(m,l)],saved=p&&Array.isArray(p.ids)&&p.ids.length;return `<div class="level ${saved?"current":""}"><div class="eyebrow">Stufe ${l}</div><div class="count">${levelCount(l)}</div><p>${l===1?"Kurze Runde mit 5 Vokabeln.":l===2?"Mittlere Runde mit 10 Vokabeln.":"Komplette Runde mit allen Vokabeln."}</p><div class="status">${saved?"● Fortschritt gespeichert":""}</div><div class="actions"><button class="btn primary" data-level="${l}">${saved?"Fortsetzen":"Starten"}</button>${saved?`<button class="btn danger" data-new="${l}">Neu</button>`:""}</div></div>`}).join("");showExercise(`<div class="exercise-head"><div class="exercise-left"><button class="btn" id="levelsBack">← Zurück</button><div><div class="exercise-title">${title}</div><div class="exercise-sub">Stufe auswählen</div></div></div></div><div class="exercise-body"><div class="exercise-shell"><div class="exercise-stage" style="display:block"><div class="endbox" style="margin:20px auto 0"><div class="eyebrow">Dein Fortschritt</div><h2 style="margin:6px 0">Wähle deine Stufe</h2><p class="muted" style="font-size:12px">Unterbrochene Runden werden gespeichert und können später fortgesetzt werden.</p><div class="levels" style="margin-top:20px">${levels}</div></div></div></div></div>`);document.getElementById("levelsBack").onclick=()=>{closeExercise();renderPage()};document.querySelectorAll("#exercise [data-level]").forEach(b=>b.onclick=()=>startLevel(m,Number(b.dataset.level)));document.querySelectorAll("#exercise [data-new]").forEach(b=>b.onclick=()=>{state.progress[pkey(m,Number(b.dataset.new))]=null;save();showLevels(m)})}
function buildQueue(m,l){let pool;if(m==="spaced"){let weighted=[];state.vocab.forEach(v=>{for(let i=0;i<Math.max(1,6-(v.box||1));i++)weighted.push(v)});pool=shuffle(weighted)}else pool=shuffle(state.vocab);let want=levelCount(l),out=[],used=new Set();for(let v of pool){if(!used.has(v.id)){used.add(v.id);out.push(v)}if(out.length>=want)break}return out}
function startLevel(m,l){if(m==="quiz"&&state.vocab.length<4){toast("Mindestens 4 Vokabeln nötig.");return}let p=state.progress?.[pkey(m,l)],map=new Map(state.vocab.map(v=>[String(v.id),v])),mainQueue=null,retryQueue=[];if(p?.mainIds?.length){mainQueue=p.mainIds.map(id=>map.get(String(id))).filter(Boolean);retryQueue=(p.retryIds||[]).map(id=>map.get(String(id))).filter(Boolean)}else if(p?.ids?.length){mainQueue=p.ids.map(id=>map.get(String(id))).filter(Boolean);retryQueue=[]}if(!mainQueue?.length)mainQueue=buildQueue(m,l);session={mode:m,level:l,queue:mainQueue,retryQueue,index:Math.max(0,p?.index||0),phase:p?.phase||"main",correct:p?.correct||0,wrong:p?.wrong||0,speedCatchup:false};if(session.phase==="retry"){session.index=Math.min(session.index,Math.max(0,session.retryQueue.length-1));if(!session.retryQueue.length){session.phase="main";session.index=0}}else session.index=Math.min(session.index,Math.max(0,session.queue.length-1));flipped=false;saveSession();if(m==="speed")renderSpeed();else renderRunning()}
function activeQueue(){return session?.phase==="retry"?session.retryQueue:session?.queue||[]}
function currentVocab(){return activeQueue()[session?.index||0]}
function saveSession(){if(!session)return;state.progress=state.progress||{};state.progress[pkey(session.mode,session.level)]={mainIds:session.queue.map(v=>v.id),retryIds:(session.retryQueue||[]).map(v=>v.id),phase:session.phase,index:session.index,correct:session.correct,wrong:session.wrong};save()}
function moveToNext(ok,v){if(ok){if(session.phase==="retry")session.retryQueue=session.retryQueue.filter(x=>String(x.id)!==String(v.id))}else if(!session.retryQueue.some(x=>String(x.id)===String(v.id))){session.retryQueue.push(v)}session.index++;if(session.phase==="main"&&session.index>=session.queue.length){session.phase="retry";session.index=0}else if(session.phase==="retry"&&session.index>=session.retryQueue.length){session.index=0}saveSession()}
function showExercise(html){let e=document.getElementById("exercise");e.innerHTML=html;e.classList.add("show")}
function closeExercise(){if(speedTimer){clearInterval(speedTimer);speedTimer=null}document.getElementById("exercise").classList.remove("show");document.getElementById("exercise").innerHTML="";session=null;flipped=false}
function renderRunning(){if(!session)return;let q=activeQueue();if(session.phase==="retry"&&q.length===0){endRound();return}if(session.index>=q.length){if(session.phase==="main"){session.phase="retry";session.index=0;saveSession();q=activeQueue();if(!q.length){endRound();return}}else{endRound();return}}let v=q[session.index],pct=q.length?Math.round(session.index/q.length*100):100;let content=session.mode==="flash"?flashHTML(v):session.mode==="quiz"?quizHTML(v):writeHTML(v),modeName={flash:"Karteikarten",quiz:"Quiz",write:"Schreiben",spaced:"Lern-Modus"}[session.mode]||"Lernen",sub=session.phase==="retry"?`Nachholen · ${session.index+1} / ${q.length}`:`Stufe ${session.level} · ${session.index+1} / ${q.length}`;showExercise(`<div class="exercise-head"><div class="exercise-left"><button class="btn" id="leaveBtn">← Aufhören</button><div><div class="exercise-title">${modeName}</div><div class="exercise-sub">${sub}</div></div></div><div class="exercise-right"><span class="hide-sm" style="font-size:11px;color:var(--muted)">🔥 ${state.streak||0}</span></div></div><div class="exercise-body"><div class="exercise-shell"><div class="progressline"><i style="width:${pct}%"></i></div>${session.phase==="retry"?`<div class="hint" style="margin:8px 0 12px;text-align:center">🔁 Falsch beantwortete Vokabeln bleiben hier, bis sie einmal richtig waren.</div>`:""}<div class="exercise-stage">${content}</div></div></div>`);document.getElementById("leaveBtn").onclick=leaveCurrent;if(session.mode==="write"){let input=document.getElementById("writeinput");setTimeout(()=>input?.focus(),80)}}
function flashHTML(v){return `<div class="flash-wrap"><div class="flash-card"><div class="flash-label">${flipped?"Français":"Deutsch"}</div><div class="flash-word">${esc(flipped?v.fr:v.de)}</div><div class="flash-note">${flipped?"Die Lösung bleibt sichtbar, bis du die Karte bewertest.":"Versuche zuerst selbst die französische Übersetzung zu erinnern."}</div>${flipped?`<button class="btn soft" id="speakFlash" style="margin-top:18px">🔊 Französisch vorlesen</button>`:""}</div><div class="exercise-foot"><button class="btn danger" id="notKnown">✗ Nicht gewusst</button><button class="btn" id="flipBtn">↻ ${flipped?"Deutsch zeigen":"Umdrehen"}</button><button class="btn green" id="known">✓ Gewusst</button></div></div>`}
function quizHTML(v){let wrong=shuffle(state.vocab.filter(x=>x.id!==v.id&&norm(x.fr)!==norm(v.fr))).slice(0,3),answers=shuffle([v.fr,...wrong.map(x=>x.fr)]);return `<div style="width:min(900px,95vw);text-align:center"><div class="eyebrow">Welche Übersetzung ist richtig?</div><div class="big-word">${esc(v.de)}</div><div class="answer-grid">${answers.map(a=>`<button class="answer" data-answer="${encodeURIComponent(a)}">${esc(a)}</button>`).join("")}</div><div class="hint">Nach deiner Antwort geht es automatisch weiter.</div></div>`}
function writeHTML(v){return `<div class="write-box"><div class="eyebrow">Übersetze ins Französische</div><div class="big-word">${esc(v.de)}</div><input id="writeinput" class="input" placeholder="Französische Übersetzung" autocomplete="off"><div class="accent">${["é","è","ê","ë","à","â","ç","î","ï","ô","ù","û","ü","œ","æ"].map(x=>`<button data-accent="${x}">${x}</button>`).join("")}</div><div class="hint">Enter = prüfen</div><div class="exercise-foot"><button class="btn primary" id="writeCheck">Antwort prüfen</button><button class="btn" id="writeSkip">Überspringen</button></div></div>`}
function flipCurrent(){if(!session||session.mode!=="flash")return;flipped=!flipped;renderRunning();if(flipped)setTimeout(()=>{const v=currentVocab(); if(v) speakFrench(v.fr)},80)}
function answerCurrent(ok){if(!session||session.mode!=="flash")return;if(!flipped){toast("Erst umdrehen, dann bewerten.");return}let v=currentVocab();record(v,ok);session.correct+=ok?1:0;session.wrong+=ok?0:1;moveToNext(ok,v);flipped=false;if(session.phase==="retry"&&session.retryQueue.length===0){endRound();return}renderRunning()}
function quizAnswer(btn){if(!session||session.mode!=="quiz")return;let v=currentVocab();if(!v||btn.disabled)return;let answer=decodeURIComponent(btn.dataset.answer||""),ok=norm(answer)===norm(v.fr);document.querySelectorAll(".answer").forEach(b=>{b.disabled=true;let a=decodeURIComponent(b.dataset.answer||"");if(norm(a)===norm(v.fr))b.classList.add("ok");else if(b===btn&&!ok)b.classList.add("no")});record(v,ok);session.correct+=ok?1:0;session.wrong+=ok?0:1;moveToNext(ok,v);setTimeout(()=>{if(session.phase==="retry"&&session.retryQueue.length===0)endRound();else renderRunning()},350)}
function checkWrite(){if(!session)return;let v=currentVocab(),input=document.getElementById("writeinput"),ans=input?.value.trim()||"";if(!ans){toast("Bitte eine Antwort eingeben.");return}let ok=norm(ans)===norm(v.fr)||distance(norm(ans),norm(v.fr))<=((Math.max(ans.length,v.fr.length)>=8)?2:1);record(v,ok);session.correct+=ok?1:0;session.wrong+=ok?0:1;moveToNext(ok,v);if(!ok)toast("Noch einmal: "+v.fr);setTimeout(()=>{if(session.phase==="retry"&&session.retryQueue.length===0)endRound();else renderRunning()},350)}
function skipWrite(){if(!session)return;let v=currentVocab();record(v,false);session.wrong++;moveToNext(false,v);if(session.phase==="retry"&&session.retryQueue.length===0)endRound();else renderRunning()}
function record(v,ok){if(ok){v.correct=(v.correct||0)+1;state.streak=(state.streak||0)+1;state.bestStreak=Math.max(state.bestStreak||0,state.streak);if(session.mode==="spaced")v.box=Math.min(5,(v.box||1)+1)}else{v.wrong=(v.wrong||0)+1;state.streak=0;if(session.mode==="spaced")v.box=1}if(state.lastDay!==today()){state.lastDay=today();state.today=0}state.today=(state.today||0)+1;state.daily[today()]=(state.daily[today()]||0)+1;v.lastLearned=new Date().toISOString();save()}
function leaveCurrent(){saveSession();closeExercise();renderPage()}
function endRound(){if(!session)return;let finished=clone(session);delete state.progress[pkey(session.mode,session.level)];save();let total=finished.correct+finished.wrong,rate=total?Math.round(finished.correct/total*100):0;showExercise(`<div class="exercise-head"><div class="exercise-left"><button class="btn" id="endBack">← Fertig</button><div><div class="exercise-title">Runde beendet</div><div class="exercise-sub">Stufe ${finished.level}</div></div></div></div><div class="exercise-body"><div class="exercise-shell"><div class="exercise-stage"><div class="endbox"><div class="eyebrow">Geschafft</div><h2>Sehr gut.</h2><p class="muted">Deine Runde ist abgeschlossen.</p><div class="endstats"><div class="card metric"><div class="label">Antworten</div><div class="value">${finished.correct+finished.wrong}</div></div><div class="card metric"><div class="label">Richtig</div><div class="value">${finished.correct}</div></div><div class="card metric"><div class="label">Erfolgsquote</div><div class="value">${rate}%</div></div></div><div class="exercise-foot"><button class="btn primary" id="againBtn">↻ Nochmal</button><button class="btn" id="doneBtn">Fertig</button></div></div></div></div></div>`);document.getElementById("againBtn").onclick=()=>startLevel(finished.mode,finished.level);document.getElementById("doneBtn").onclick=()=>{closeExercise();renderPage()};document.getElementById("endBack").onclick=()=>{closeExercise();renderPage()}}
function speakFrench(text){if(!speechAvailable||!text)return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text),voices=window.speechSynthesis.getVoices(),fr=voices.find(v=>/^fr[-_]/i.test(v.lang))||voices.find(v=>/french|français/i.test(v.name));u.voice=fr||null;u.lang=fr?.lang||"fr-FR";u.rate=.9;window.speechSynthesis.speak(u)}
function renderSpeed(){let q=activeQueue();if(session.phase==="retry"&&q.length===0){endRound();return}if(session.index>=q.length){if(session.phase==="main"){session.phase="retry";session.index=0;saveSession();q=activeQueue();if(!q.length){endRound();return}}else{endRound();return}}let v=q[session.index];clearInterval(speedTimer);let timed=session.phase==="main"&&!session.speedCatchup;showExercise(`<div class="exercise-head"><div class="exercise-left"><button class="btn" id="speedLeave">← Aufhören</button><div><div class="exercise-title">Speed${session.phase==="retry"?" · Nachholen":""}</div><div class="exercise-sub">Stufe ${session.level} · ${session.phase==="retry"?`Nachholen · ${session.index+1} / ${q.length}`:`Aufgabe ${session.index+1}`}</div></div></div><div class="exercise-right">${timed?`<span class="timer" id="timer">60</span>`:`<span class="hide-sm" style="font-size:11px;color:var(--muted)">Ohne Zeitlimit</span>`}</div></div><div class="exercise-body"><div class="exercise-shell"><div class="progressline"><i style="width:${q.length?Math.round(session.index/q.length*100):100}%"></i></div>${session.phase==="retry"?`<div class="hint" style="margin:8px 0 12px;text-align:center">🔁 Diese Vokabeln bleiben, bis du sie einmal richtig hast.</div>`:""}<div class="exercise-stage"><div style="width:min(900px,95vw);text-align:center"><div class="eyebrow">Welche Übersetzung passt?</div><div class="big-word">${esc(v.de)}</div><div class="answer-grid">${speedAnswers(v).map(a=>`<button class="answer" data-speed="${encodeURIComponent(a)}">${esc(a)}</button>`).join("")}</div><div class="hint">Keine Lösung wird vorgelesen.</div></div></div></div></div>`);document.getElementById("speedLeave").onclick=leaveCurrent;if(timed){speedTimer=setInterval(()=>{let t=document.getElementById("timer");if(!t)return;let n=Number(t.textContent)-1;t.textContent=n;if(n<=0)finishSpeed()},1000)}}
function speedAnswers(v){return shuffle([v.fr,...shuffle(state.vocab.filter(x=>x.id!==v.id)).slice(0,3).map(x=>x.fr)])}
function finishSpeed(){clearInterval(speedTimer);speedTimer=null;state.highscore=Math.max(state.highscore||0,session.correct||0);save();if(session.retryQueue&&session.retryQueue.length){session.phase="retry";session.speedCatchup=true;session.index=0;saveSession();renderSpeed()}else endRound()}
function renderWords(c){document.getElementById("pageTitle").textContent="Vokabeln";document.getElementById("pageSubtitle").textContent=state.vocab.length+" gespeichert";c.innerHTML=`<div class="card"><div class="toolrow"><input id="wordSearch" class="input wide" placeholder="Vokabel suchen..."><button class="btn primary" id="addWord">+ Hinzufügen</button><button class="btn" id="importBtn">Import</button><button class="btn" id="exportBtn">Export</button></div><div class="table-wrap"><table><thead><tr><th>Deutsch</th><th>Französisch</th><th>Tag</th><th>Box</th><th>Aktionen</th></tr></thead><tbody id="rows">${state.vocab.map(v=>rowHTML(v)).join("")}</tbody></table></div></div>`;document.getElementById("addWord").onclick=()=>openWordModal();document.getElementById("importBtn").onclick=importJSONPrompt;document.getElementById("exportBtn").onclick=exportJSON;document.getElementById("wordSearch").oninput=filterWords;c.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openWordModal(b.dataset.edit));c.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>{if(confirm("Vokabel löschen?")){state.vocab=state.vocab.filter(v=>String(v.id)!==String(b.dataset.delete));save();renderWords(c)}})}
function rowHTML(v){return `<tr><td><strong>${esc(v.de)}</strong></td><td>${esc(v.fr)}</td><td><span class="tag">${esc(v.tag||"")}</span></td><td>Box ${v.box||1}/5</td><td><button class="btn" data-edit="${esc(v.id)}">Bearbeiten</button> <button class="btn danger" data-delete="${esc(v.id)}">Löschen</button></td></tr>`}
function filterWords(){let q=norm(this.value);document.querySelectorAll("#rows tr").forEach(r=>r.style.display=norm(r.textContent).includes(q)?"":"none")}
function renderStats(c){document.getElementById("pageTitle").textContent="Statistik";document.getElementById("pageSubtitle").textContent="Dein Lernfortschritt";let r=state.vocab.reduce((a,v)=>a+(v.correct||0),0),w=state.vocab.reduce((a,v)=>a+(v.wrong||0),0),rate=r+w?Math.round(r/(r+w)*100):0;let days=[];for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let key=d.toISOString().slice(0,10);days.push([key,state.daily[key]||0])}let mx=Math.max(1,...days.map(x=>x[1]));c.innerHTML=`<div class="grid g4"><div class="card metric"><div class="label">Antworten</div><div class="value">${r+w}</div></div><div class="card metric"><div class="label">Richtig</div><div class="value">${r}</div></div><div class="card metric"><div class="label">Erfolgsquote</div><div class="value">${rate}%</div></div><div class="card metric"><div class="label">Heute</div><div class="value">${state.today||0}</div></div></div><div class="stats-grid" style="margin-top:16px"><div class="card"><div class="section-title" style="margin-top:0"><h3>Letzte 7 Tage</h3><span>Antworten</span></div><div class="chart">${days.map(([d,n])=>`<div class="barcol"><i style="height:${Math.max(4,Math.round(n/mx*170))}px"></i><span>${d.slice(8)}</span></div>`).join("")}</div></div><div class="card"><div class="section-title" style="margin-top:0"><h3>Leitner-Boxen</h3><span>schwieriger → leichter</span></div>${[1,2,3,4,5].map(b=>`<div style="display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #eef1f3;font-size:12px"><span>Box ${b}</span><strong>${state.vocab.filter(v=>(v.box||1)===b).length}</strong></div>`).join("")}</div></div>`}
function renderSettings(c){document.getElementById("pageTitle").textContent="Einstellungen";document.getElementById("pageSubtitle").textContent="Ziel und Daten verwalten";c.innerHTML=`<div class="grid g2"><div class="card"><div class="eyebrow">Tagesziel</div><h3 style="margin:6px 0">Wie viel möchtest du heute lernen?</h3><p class="muted" style="font-size:12px">Das Ziel zählt jede bewertete Vokabel.</p><input id="goalInput" class="input" type="number" min="1" max="500" value="${state.goal||20}"><div class="actions"><button class="btn primary" id="saveGoal">Speichern</button></div></div><div class="card"><div class="eyebrow">Daten</div><h3 style="margin:6px 0">Backup und Reset</h3><p class="muted" style="font-size:12px">Exportiere deinen Stand oder setze alle Lernwerte zurück.</p><div class="actions"><button class="btn" id="exportSettings">JSON exportieren</button><button class="btn danger" id="resetSettings">Alles zurücksetzen</button></div></div></div>`;document.getElementById("saveGoal").onclick=()=>{state.goal=Math.max(1,Math.min(500,Number(document.getElementById("goalInput").value)||20));save();updateGoal();toast("Tagesziel gespeichert")};document.getElementById("exportSettings").onclick=exportJSON;document.getElementById("resetSettings").onclick=()=>{if(confirm("Wirklich alle Lernstände zurücksetzen?")){localStorage.removeItem(STORAGE);state=loadState();renderPage();toast("Zurückgesetzt")}}}
function openWordModal(id=null){let v=id?state.vocab.find(x=>String(x.id)===String(id)):null;showModal(v?"Vokabel bearbeiten":"Neue Vokabel",`<div class="formrow"><label>Deutsch</label><input id="mde" class="input" value="${esc(v?.de||"")}"></div><div class="formrow"><label>Französisch</label><input id="mfr" class="input" value="${esc(v?.fr||"")}"></div><div class="formrow"><label>Tag</label><input id="mtag" class="input" value="${esc(v?.tag||"")}"></div><button class="btn primary" id="saveWord">Speichern</button>`);document.getElementById("saveWord").onclick=()=>{let de=document.getElementById("mde").value.trim(),fr=document.getElementById("mfr").value.trim(),tag=document.getElementById("mtag").value.trim();if(!de||!fr){toast("Deutsch und Französisch ausfüllen.");return}if(v)Object.assign(v,{de,fr,tag});else state.vocab.push({id:Date.now().toString(),fr,de,tag,correct:0,wrong:0,box:1,lastLearned:null});save();closeModal();renderPage()}}
function showModal(t,b){document.getElementById("modalTitle").textContent=t;document.getElementById("modalContent").innerHTML=b;document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function exportJSON(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}));a.download="vokabel-trainer.json";document.body.appendChild(a);a.click();a.remove()}
function importJSONPrompt(){showModal("JSON importieren",`<textarea id="importJson" class="textarea" placeholder='{"vocab":[...]}'}></textarea><div class="actions"><button class="btn primary" id="doImport">Importieren</button></div>`);document.getElementById("doImport").onclick=()=>{try{let x=JSON.parse(document.getElementById("importJson").value);if(!Array.isArray(x.vocab))throw 0;state=Object.assign(loadState(),x,{vocab:x.vocab});save();closeModal();renderPage();toast("Import erfolgreich")}catch(e){toast("Ungültige JSON")}}}

document.addEventListener("click",e=>{
 if(!document.getElementById("exercise").classList.contains("show"))return;
 let q=e.target.closest("[data-answer]");if(q&&session?.mode==="quiz"){e.preventDefault();quizAnswer(q);return}
 let s=e.target.closest("#speakFlash");if(s){e.preventDefault();speakFrench(session?.queue?.[session.index]?.fr||"");return}
 if(e.target.id==="flipBtn"){flipCurrent();return} if(e.target.id==="known"){answerCurrent(true);return} if(e.target.id==="notKnown"){answerCurrent(false);return}
 if(e.target.id==="writeCheck"){checkWrite();return} if(e.target.id==="writeSkip"){skipWrite();return}
 let ac=e.target.closest("[data-accent]");if(ac&&session?.mode==="write"){let input=document.getElementById("writeinput");if(!input)return;let p=input.selectionStart??input.value.length;let q2=input.selectionEnd??p;input.value=input.value.slice(0,p)+ac.dataset.accent+input.value.slice(q2);input.focus();input.selectionStart=input.selectionEnd=p+ac.dataset.accent.length;return}
 let sp=e.target.closest("[data-speed]");if(sp&&session?.mode==="speed"){let v=currentVocab(),ok=norm(decodeURIComponent(sp.dataset.speed))===norm(v.fr);document.querySelectorAll("[data-speed]").forEach(b=>{b.disabled=true;let a=decodeURIComponent(b.dataset.speed);if(norm(a)===norm(v.fr))b.classList.add("ok");else if(b===sp&&!ok)b.classList.add("no")});record(v,ok);session.correct+=ok?1:0;session.wrong+=ok?0:1;moveToNext(ok,v);setTimeout(()=>{if(session.phase==="retry"&&session.retryQueue.length===0){endRound();return}if(session.phase==="main"&&document.getElementById("timer")?.textContent==="0"){finishSpeed();return}renderSpeed()},300)}
});
document.addEventListener("keydown",e=>{if(!document.getElementById("exercise").classList.contains("show")||!session)return;if(session.mode==="flash"&&e.code==="Space"){e.preventDefault();flipCurrent()}if(session.mode==="flash"&&e.key==="ArrowRight"&&flipped){e.preventDefault();answerCurrent(true)}if(session.mode==="flash"&&e.key==="ArrowLeft"&&flipped){e.preventDefault();answerCurrent(false)}if(session.mode==="write"&&e.key==="Enter"){e.preventDefault();checkWrite()}});
renderPage();
</script>

<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script>
